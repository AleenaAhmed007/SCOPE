# Model hyperparameters and experiment defaults (Phase 0 placeholders)
random_seed: 42

# Values below document what the training code uses.
classification:
  algorithm: random_forest         # selected by validation F1 (PR-AUC tie-break)
  baseline: logistic_regression
  selection_metric: f1
  params:
    n_estimators: 400
    max_depth: 14
    min_samples_leaf: 3
    class_weight: balanced_subsample

regression:
  algorithm: shipment_mode_median  # preferred unless ML beats it by >=1% val MAE
  objective: reg:absoluteerror
  params:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.04
    subsample: 0.85
    colsample_bytree: 0.75

forecasting:
  candidates: [naive_lag1, mean_baseline, persistence_linear, gradient_boosting, random_forest, extra_trees, arima]
  lags: [1, 2, 3, 4, 6, 12]
  baseline_preference_margin: 0.05  # require 5% val MAE gain to prefer ML
  arima_order_selection: aic
  horizon: 1
  frequency: monthly
  per_product_group: true

clustering:
  algorithm: kmeans
  params:
    n_clusters: 4
    random_state: 42

anomaly:
  algorithm: isolation_forest
  primary: vendor_kpi              # supplier KPIs per vendor-quarter
  params:
    contamination: 0.05
    random_state: 42

explainability:
  method: shap
  sample_size: 200
