# Model hyperparameters and experiment defaults (Phase 0 placeholders)
random_seed: 42

# Values below document what the training code uses.
classification:
  algorithm: xgboost
  baseline: logistic_regression   # proposal baseline; random_forest also compared
  params:
    n_estimators: 200
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: logloss

regression:
  algorithm: xgboost
  objective: reg:absoluteerror    # selection metric is MAE
  params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

forecasting:
  candidates: [naive_lag1, mean_baseline, persistence_linear, gradient_boosting, random_forest, extra_trees, arima]
  arima_order_selection: aic       # (p,d,q) in {0..2}x{0,1}x{0,1}, optional seasonal AR
  horizon: 1                       # rolling one-step-ahead
  frequency: monthly               # primary deployed path
  weekly_lstm_trial: true          # evaluate LSTM on weekly series vs classical
  lstm:
    lookback_weeks: 12
    hidden: 32
    deploy_rule: validation_mae_beats_classical_by_2pct
  per_product_group: true

clustering:
  algorithm: kmeans
  params:
    n_clusters: 4
    random_state: 42

anomaly:
  algorithm: isolation_forest
  primary: vendor_kpi              # supplier KPIs per vendor-quarter
  params:
    contamination: 0.05
    random_state: 42

explainability:
  method: shap
  sample_size: 200
