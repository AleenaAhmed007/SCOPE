# Dataset and path configuration for SCOPE
# Trial branch: DataCo SMART Supply Chain (Mendeley) adapted to SCMS schema
project_name: SCOPE
random_seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  reports: reports
  figures: reports/figures
  metrics: reports/metrics
  models: reports/models

datasets:
  primary:
    name: DataCo_adapted_for_SCOPE
    filename: DataCo_adapted_for_SCOPE.csv
    relative_path: data/raw/DataCo_adapted_for_SCOPE.csv
    format: csv
    encoding: utf-8
    source: mendeley
    source_doi: "10.17632/8gx2fvg2k6.5"
    source_url: "https://data.mendeley.com/datasets/8gx2fvg2k6/5"
    notes: >
      Adapted from DataCoSupplyChainDataset.csv via scope.data.dataco_adapter.
      Inventory_* columns are synthetic trial proxies, not real warehouse data.
  scms_legacy:
    name: SCMS_with_inventory
    filename: SCMS_with_inventory.csv
    relative_path: data/raw/SCMS_with_inventory.csv
    format: csv
    encoding: utf-8

splits:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  stratify: true

# Target placeholders — refined in later phases
targets:
  late_delivery: null
  delivery_duration: null
  inventory: null
